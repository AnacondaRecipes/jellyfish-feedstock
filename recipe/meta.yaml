{% set name = "jellyfish" %}
{% set version = "1.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: fd77ba8e1c9835d2c56b11bde6765380cbcac333037974c4ba4b60092c383212

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<311]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
  host:
    - pip
    - python
    - maturin >=0.14,<2
  run:
    - python

test:
  source_files:
    - tests
    - testdata
  imports:
    - jellyfish
  commands:
    - pip check
    - pytest -v tests
  requires:
    - pip
    - pytest

about:
  home: https://github.com/jamesturk/jellyfish
  license: MIT
  license_file: LICENSE
  license_family: MIT
  summary: A library for doing approximate and phonetic matching of strings
  description: |
    jellyfish is a library for approximate & phonetic matching of strings.
  dev_url: https://github.com/jamesturk/jellyfish
  doc_url: https://www.jpt.sh/projects/jellyfish

extra:
  recipe-maintainers:
    - blabalme
    - anthchirp
